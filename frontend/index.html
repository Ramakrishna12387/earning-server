<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>White Jack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #07111f, #102a43);
            color: white;
            min-height: 100vh;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: auto;
            padding: 25px 0 50px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 42px;
            margin: 10px 0;
        }

        .header p {
            color: #b9c7d8;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .player-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 200px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            border: none;
            padding: 13px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            margin: 5px;
        }

        .primary {
            background: #00d084;
            color: #04130d;
        }

        .secondary {
            background: #287bff;
            color: white;
        }

        .danger {
            background: #ff4d5a;
            color: white;
        }

        .dark {
            background: #26384d;
            color: white;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .stat {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 14px;
            padding: 15px;
            text-align: center;
        }

        .stat small {
            display: block;
            color: #aebdce;
            margin-bottom: 8px;
        }

        .stat strong {
            font-size: 22px;
        }

        .game-area {
            display: none;
        }

        .game-title {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .hand {
            margin: 20px 0;
        }

        .hand h3 {
            margin-bottom: 12px;
        }

        .cards {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .playing-card {
            width: 70px;
            height: 95px;
            background: white;
            color: #111;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .total {
            margin-top: 10px;
            font-size: 18px;
            color: #b9c7d8;
        }

        .result {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 35px;
        }

        .actions {
            text-align: center;
            margin-top: 20px;
        }

        .message {
            text-align: center;
            margin: 15px 0;
            color: #c9d6e5;
        }

        .leaderboard {
            display: none;
        }

        .leader-row {
            display: grid;
            grid-template-columns: 50px 1fr 100px 80px;
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer {
            text-align: center;
            color: #71849a;
            margin-top: 25px;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .header h1 {
                font-size: 34px;
            }

            .leader-row {
                grid-template-columns: 40px 1fr 80px;
            }

            .leader-row span:last-child {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🃏 WHITE JACK</h1>
            <p>Virtual Coin Blackjack Game</p>
        </div>


        <!-- PLAYER -->
        <div class="card">

            <h2>👤 Player</h2>

            <div class="player-box">

                <input type="text" id="playerName" placeholder="Enter your name" value="Krishna">

                <button class="primary" onclick="loginPlayer()">
                    LOGIN / CREATE
                </button>

            </div>

            <div class="message" id="playerMessage">
                Enter your name and start playing.
            </div>

            <div class="stats">

                <div class="stat">
                    <small>💰 Coins</small>
                    <strong id="coins">-</strong>
                </div>

                <div class="stat">
                    <small>🏆 Wins</small>
                    <strong id="wins">-</strong>
                </div>

                <div class="stat">
                    <small>❌ Losses</small>
                    <strong id="losses">-</strong>
                </div>

                <div class="stat">
                    <small>🎮 Games</small>
                    <strong id="games">-</strong>
                </div>

            </div>

        </div>


        <!-- GAME -->
        <div class="card game-area" id="gameArea">

            <div class="game-title">
                🃏 White Jack Table
            </div>


            <!-- DEALER -->

            <div class="hand">

                <h3>🤵 Dealer</h3>

                <div class="cards" id="dealerCards"></div>

                <div class="total">
                    Dealer Total:
                    <strong id="dealerTotal">-</strong>
                </div>

            </div>


            <!-- PLAYER -->

            <div class="hand">

                <h3>👤 You</h3>

                <div class="cards" id="playerCards"></div>

                <div class="total">
                    Your Total:
                    <strong id="playerTotal">-</strong>
                </div>

            </div>


            <div class="result" id="result"></div>


            <div class="actions">

                <button class="primary" id="playButton" onclick="playGame()">
                    🎴 PLAY WHITE JACK
                </button>

            </div>

        </div>


        <!-- LEADERBOARD -->

        <div class="card leaderboard" id="leaderboardArea">

            <h2>🏆 Leaderboard</h2>

            <div class="leader-row">
                <strong>#</strong>
                <strong>Player</strong>
                <strong>Coins</strong>
                <strong>Wins</strong>
            </div>

            <div id="leaderboardList"></div>

        </div>


        <div class="card">

            <div style="text-align:center">

                <button class="secondary" onclick="showLeaderboard()">
                    🏆 Leaderboard
                </button>

                <button class="dark" onclick="hideLeaderboard()">
                    ✖ Hide
                </button>

            </div>

        </div>


        <div class="footer">
            White Jack uses virtual coins only.
        </div>

    </div>


    <script>

        // IMPORTANT:
        // Same server will be used locally and on Render.
        const API = window.location.origin;

        let currentPlayer = "";


        // =========================
        // LOGIN / CREATE PLAYER
        // =========================

        async function loginPlayer() {

            const nameInput = document.getElementById("playerName");

            const name = nameInput.value.trim();

            if (!name) {

                alert("Please enter your name.");

                return;
            }

            try {

                const response = await fetch(API + "/player", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name
                    })

                });


                const data = await response.json();


                if (!response.ok) {

                    alert(data.error || "Unable to create player.");

                    return;
                }


                currentPlayer = data.name;


                updateStats(data);


                document.getElementById("gameArea").style.display = "block";


                document.getElementById("playerMessage").innerText =
                    "Welcome " + currentPlayer + "! Ready to play.";


                document.getElementById("result").innerText = "";


            } catch (error) {

                console.error(error);

                alert(
                    "Server connection failed.\n\n" +
                    "Make sure Flask server is running."
                );
            }
        }


        // =========================
        // UPDATE PLAYER STATS
        // =========================

        function updateStats(data) {

            document.getElementById("coins").innerText =
                data.coins ?? "-";

            document.getElementById("wins").innerText =
                data.wins ?? "-";

            document.getElementById("losses").innerText =
                data.losses ?? "-";

            document.getElementById("games").innerText =
                data.games_played ?? "-";
        }


        // =========================
        // PLAY WHITE JACK
        // =========================

        async function playGame() {

            if (!currentPlayer) {

                alert("Please login first.");

                return;
            }


            const button = document.getElementById("playButton");

            button.disabled = true;

            button.innerText = "🎴 DEALING...";


            try {

                const response = await fetch(API + "/blackjack", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: currentPlayer
                    })

                });


                const data = await response.json();


                if (!response.ok) {

                    alert(data.error || "Game error.");

                    return;
                }


                displayCards(
                    "playerCards",
                    data.player_cards
                );


                displayCards(
                    "dealerCards",
                    data.dealer_cards
                );


                document.getElementById("playerTotal").innerText =
                    data.player_total;


                document.getElementById("dealerTotal").innerText =
                    data.dealer_total;


                document.getElementById("result").innerText =
                    data.message;


                document.getElementById("playerMessage").innerText =
                    "Game completed!";


                updateStats(data);


            } catch (error) {

                console.error(error);

                alert(
                    "Unable to connect to White Jack server."
                );

            } finally {

                button.disabled = false;

                button.innerText = "🎴 PLAY WHITE JACK";
            }
        }


        // =========================
        // DISPLAY CARDS
        // =========================

        function displayCards(elementId, cards) {

            const container =
                document.getElementById(elementId);


            container.innerHTML = "";


            cards.forEach(function (card) {

                const cardElement =
                    document.createElement("div");


                cardElement.className =
                    "playing-card";


                cardElement.innerText = card;


                container.appendChild(cardElement);

            });
        }


        // =========================
        // LEADERBOARD
        // =========================

        async function showLeaderboard() {

            try {

                const response =
                    await fetch(API + "/leaderboard");


                const data =
                    await response.json();


                const list =
                    document.getElementById("leaderboardList");


                list.innerHTML = "";


                if (data.length === 0) {

                    list.innerHTML =
                        "<p>No players yet.</p>";

                } else {

                    data.forEach(function (player, index) {

                        const row =
                            document.createElement("div");


                        row.className =
                            "leader-row";


                        row.innerHTML = `

                        <span>${index + 1}</span>

                        <span>${escapeHtml(player.name)}</span>

                        <span>💰 ${player.coins}</span>

                        <span>${player.wins}</span>

                    `;


                        list.appendChild(row);

                    });
                }


                document.getElementById(
                    "leaderboardArea"
                ).style.display = "block";


            } catch (error) {

                console.error(error);

                alert("Unable to load leaderboard.");
            }
        }


        // =========================
        // HIDE LEADERBOARD
        // =========================

        function hideLeaderboard() {

            document.getElementById(
                "leaderboardArea"
            ).style.display = "none";
        }


        // =========================
        // SECURITY HELPER
        // =========================

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.innerText = text;

            return div.innerHTML;
        }


    </script>

</body>

</html>
