<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>White Jack</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    background:
    radial-gradient(
        circle at top,
        #263238,
        #080b0f 60%
    );

    color: white;

    min-height: 100vh;

}


.container {

    width: 95%;

    max-width: 900px;

    margin: auto;

    padding: 25px 0 50px;

}


.header {

    text-align: center;

    margin-bottom: 25px;

}


.logo {

    font-size: 45px;

    font-weight: bold;

    letter-spacing: 3px;

}


.subtitle {

    color: #aaa;

    margin-top: 5px;

}


.player-card {

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.12);

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 20px;

    backdrop-filter: blur(10px);

}


.player-name {

    font-size: 22px;

    font-weight: bold;

}


.coins {

    font-size: 32px;

    font-weight: bold;

    margin-top: 8px;

}


.stats {

    display: grid;

    grid-template-columns:
    repeat(3, 1fr);

    gap: 10px;

    margin-top: 15px;

}


.stat {

    background: rgba(255,255,255,0.07);

    padding: 15px;

    border-radius: 12px;

    text-align: center;

}


.stat-number {

    font-size: 22px;

    font-weight: bold;

}


.game {

    background:
    linear-gradient(
        145deg,
        #0b5d3b,
        #063622
    );

    border-radius: 25px;

    padding: 25px;

    min-height: 430px;

    box-shadow:
    0 20px 50px
    rgba(0,0,0,0.5);

}


.section-title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 15px;

}


.cards {

    display: flex;

    gap: 15px;

    flex-wrap: wrap;

}


.card {

    width: 90px;

    height: 125px;

    background: white;

    color: #111;

    border-radius: 12px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 30px;

    font-weight: bold;

    box-shadow:
    0 8px 15px
    rgba(0,0,0,0.3);

}


.total {

    margin-top: 12px;

    font-size: 20px;

    font-weight: bold;

}


.buttons {

    display: flex;

    gap: 12px;

    flex-wrap: wrap;

    margin-top: 30px;

}


button {

    border: none;

    border-radius: 12px;

    padding: 15px 25px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;

}


.play {

    background: #ffd54f;

    color: #111;

}


.leaderboard {

    background: #ffffff;

    color: #111;

}


button:hover {

    transform: translateY(-2px);

}


.result {

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    margin-top: 25px;

    min-height: 35px;

}


.leaderboard-box {

    margin-top: 20px;

    background:
    rgba(0,0,0,0.35);

    border-radius: 15px;

    padding: 20px;

    display: none;

}


.rank {

    display: flex;

    justify-content: space-between;

    padding: 12px;

    border-bottom:
    1px solid
    rgba(255,255,255,0.1);

}


@media(max-width:600px) {

    .logo {

        font-size: 34px;

    }

    .stats {

        grid-template-columns: 1fr;

    }

    .card {

        width: 70px;

        height: 100px;

    }

}

</style>

</head>


<body>


<div class="container">


<div class="header">

<div class="logo">
♠ WHITE JACK ♠
</div>

<div class="subtitle">
Virtual Coin Blackjack
</div>

</div>


<div class="player-card">

<div class="player-name">
👤 Krishna
</div>

<div class="coins">
🪙 <span id="coins">Loading...</span>
</div>


<div class="stats">

<div class="stat">

<div class="stat-number"
id="wins">
0
</div>

<div>Wins</div>

</div>


<div class="stat">

<div class="stat-number"
id="losses">
0
</div>

<div>Losses</div>

</div>


<div class="stat">

<div class="stat-number"
id="games">
0
</div>

<div>Games</div>

</div>

</div>

</div>


<div class="game">


<div class="section-title">
Dealer
</div>

<div class="cards"
id="dealerCards">

<div class="card">?</div>

<div class="card">?</div>

</div>


<div class="total"
id="dealerTotal">
Dealer Total: -
</div>


<br>


<div class="section-title">
Your Cards
</div>

<div class="cards"
id="playerCards">

<div class="card">?</div>

<div class="card">?</div>

</div>


<div class="total"
id="playerTotal">
Your Total: -
</div>


<div class="result"
id="result">
Ready to Play
</div>


<div class="buttons">

<button
class="play"
onclick="playBlackjack()">

🃏 PLAY WHITE JACK

</button>


<button
class="leaderboard"
onclick="showLeaderboard()">

🏆 LEADERBOARD

</button>

</div>


<div
class="leaderboard-box"
id="leaderboardBox">

<h3>🏆 Top Players</h3>

<div id="leaderboardList"></div>

</div>


</div>

</div>


<script>


const API =
"http://127.0.0.1:5000";

const playerName =
"Krishna";


async function createPlayer() {

    try {

        await fetch(
            API + "/player",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                    name: playerName
                })

            }
        );

    }

    catch(error) {

        console.log(error);

    }

}


async function loadPlayer() {

    try {

        const response =
        await fetch(
            API +
            "/player/" +
            encodeURIComponent(playerName)
        );

        const data =
        await response.json();


        document.getElementById(
            "coins"
        ).textContent =
        data.coins;


        document.getElementById(
            "wins"
        ).textContent =
        data.wins;


        document.getElementById(
            "losses"
        ).textContent =
        data.losses;


        document.getElementById(
            "games"
        ).textContent =
        data.games_played;

    }

    catch(error) {

        document.getElementById(
            "coins"
        ).textContent =
        "Server Offline";

        console.log(error);

    }

}


function displayCards(
    elementId,
    cards
) {

    const container =
    document.getElementById(
        elementId
    );

    container.innerHTML = "";


    cards.forEach(card => {

        const div =
        document.createElement(
            "div"
        );

        div.className = "card";

        div.textContent = card;

        container.appendChild(div);

    });

}


async function playBlackjack() {

    const resultElement =
    document.getElementById(
        "result"
    );


    resultElement.textContent =
    "🃏 Dealing cards...";


    try {

        const response =
        await fetch(
            API + "/blackjack",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                    name: playerName

                })

            }
        );


        const data =
        await response.json();


        if (!response.ok) {

            resultElement.textContent =
            data.error ||
            "Game error";

            return;

        }


        displayCards(
            "playerCards",
            data.player_cards
        );


        displayCards(
            "dealerCards",
            data.dealer_cards
        );


        document.getElementById(
            "playerTotal"
        ).textContent =
        "Your Total: " +
        data.player_total;


        document.getElementById(
            "dealerTotal"
        ).textContent =
        "Dealer Total: " +
        data.dealer_total;


        resultElement.textContent =
        data.message;


        loadPlayer();

    }

    catch(error) {

        resultElement.textContent =
        "❌ Server connection error";

        console.log(error);

    }

}


async function showLeaderboard() {

    const box =
    document.getElementById(
        "leaderboardBox"
    );

    const list =
    document.getElementById(
        "leaderboardList"
    );


    box.style.display =
    "block";


    list.innerHTML =
    "Loading...";


    try {

        const response =
        await fetch(
            API + "/leaderboard"
        );


        const players =
        await response.json();


        list.innerHTML = "";


        players.forEach(
            (player, index) => {

                const row =
                document.createElement(
                    "div"
                );

                row.className =
                "rank";


                row.innerHTML = `

                    <span>
                    #${index + 1}
                    ${player.name}
                    </span>

                    <strong>
                    🪙 ${player.coins}
                    </strong>

                `;


                list.appendChild(row);

            }
        );

    }

    catch(error) {

        list.innerHTML =
        "Unable to load leaderboard.";

    }

}


async function start() {

    await createPlayer();

    await loadPlayer();

}


start();

</script>


</body>

</html>
